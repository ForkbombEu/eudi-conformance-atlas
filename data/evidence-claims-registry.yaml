  - slug: wallet-user-approval-before-disclosure
    title: Wallet presents attributes only after user approval
    internal_id: credimi.evidence.wallet.presentation.user_approval_before_disclosure.v1
    actor: wallet
    domain: presentation
    description: Evidence that the Wallet does not disclose requested attributes to the Relying Party before the user has
