non_goals:
- Credimi evidence claims are not official requirement identifiers.
- Credimi does not act as a certification body unless separately accredited or mandated.
- Credimi does not directly introspect real Wallet internals.
- Credimi does not replace Member State or CAB legal conformity decisions.
status_vocabulary:
  supported_native: 'Executable with current Credimi primitives: StepCI, Maestro, Temporal, screenshots, videos, logs.'
  supported_third_party: Executable through integrated OpenID / WE BUILD / headless conformance tests.
  easy_helper_step: Small validator/checker/helper required, usually StepCI/Golang/YAML.
  requires_spec: Blocked mainly by missing/stabilizing ARF/WE BUILD/ETSI/certificate/list/profile details.
  requires_fixture: 'Needs positive/negative fixtures: certs, lists, WUAs, credentials, metadata, requests.'
  manual_review: Not fully black-box automatable; needs declaration, audit, CAB/human review.
  not_directly_observable: Real Wallet internals cannot be inspected; only inferred from behavior.
evidence_type_vocabulary:
  behavioral_black_box: Observed wallet/app behavior driven by Maestro.
  protocol_trace: HTTP/API/deeplink/callback/metadata evidence captured by StepCI.
  third_party_result: OpenID / WE BUILD / headless test result ingested by Credimi.
  trust_resolution: Result from list/certificate/revocation/entitlement helper.
  assurance_documentation: Report/certificate/log bundle intended for certification dependency analysis.
  manual_attestation: Declaration/audit evidence, not automatically proven by Credimi.
profiles:
- profile_slug: wallet-protocols-and-user-flow
  title: Wallet protocols and user-flow evidence
  actor_under_test: wallet
  description: Evidence that a real Wallet instance can execute issuance and presentation flows through required protocols/interfaces,
    and that observable user-facing behavior matches approval/display/selective-disclosure requirements.
  evidence_claims:
  - slug: wallet-receives-pid-eaa-issuance-request
    title: Wallet receives PID/EAA issuance request
    internal_id: credimi.evidence.wallet.issuance.receives_pid_eaa_request.v1
    actor: wallet
    domain: issuance
    description: Evidence that a real Wallet receives a PID/EAA issuance request through a credential offer, deeplink or QR
      and starts the issuance flow.
    official_references:
      legal:
      - source: EU-2024-2982
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2982/oj
        article: Article 4
        short: Issuance of PID and EAAs to wallet units.
      - source: EU-2024-2977
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2977/oj
        article: Article 3
        short: Issuance of person identification data to wallet units.
      - source: EU-2024-2977
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2977/oj
        article: Article 4
        short: Issuance of electronic attestations of attributes to wallet units.
      arf:
      - harmonized_id: EW-PIO-01-003
        index: OIA_03
        short: Required protocol standards for issuing, presenting, verifying attestations.
      - harmonized_id: AS-AP-10-029
        index: ISSU_22
        short: Credential Issuer metadata signing / issuer metadata evidence.
      - harmonized_id: AS-AP-10-048
        index: ISSU_32
        short: Attestation Provider metadata signing / issuer metadata evidence.
      webuild:
      - use_case_id: UC-TE-02
        name: Wallet Unit Evaluates Credential Issuer
        path: task1-use-cases/subtask1-2-trust-registry/wallet-unit-evaluates-credential-issuer.md
    suggested_action_mappings:
      maestro_categories:
      - Get credential
      - Get credential (Generic)
      stepci_categories:
      - credential-offer
      external_tests: []
    evidence_contribution_types:
    - behavioral_black_box
    - protocol_trace
    expected_artifacts:
    - credential_offer
    - issuer_metadata_snapshot
    - maestro_flow_output
    - test_run_url
    - result_video_urls
    - screenshot_urls
    - temporal_workflow_id
    - workflow_run_id
    default_status:
    - supported_native
    limitations:
    - This proves observable wallet behavior and interoperability with the issuer flow, not internal wallet implementation
      correctness.
  - slug: wallet-completes-pid-eaa-issuance
    title: Wallet completes PID/EAA issuance
    internal_id: credimi.evidence.wallet.issuance.completes_pid_eaa_issuance.v1
    actor: wallet
    domain: issuance
    description: Evidence that a real Wallet completes an issuance flow and displays or stores the issued PID/EAA.
    official_references:
      legal:
      - source: EU-2024-2977
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2977/oj
        article: Article 3(2)-(5)
        short: PID contains authentication/validation information and is cryptographically bound to the wallet unit.
      - source: EU-2024-2977
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2977/oj
        article: Article 4(1)-(3)
        short: EAAs comply with supported standards and contain authentication/validation information.
      - source: EU-2024-2979
        url: https://eur-lex.europa.eu/eli/reg_impl/2024/2979/oj
        recital_or_article: Recital 6
        short: Wallets securely request, obtain, select, combine, store, delete, share and present PID and EAAs under user
