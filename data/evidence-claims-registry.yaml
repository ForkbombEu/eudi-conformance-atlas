      arf:
      - harmonized_id: EW-PIO-01-003
        index: OIA_03
      webuild:
      - use_case_id: UC-TE-02
        name: Wallet Unit Evaluates Credential Issuer
    suggested_action_mappings:
      maestro_categories:
      - Get credential
      - Get credential (Generic)
      stepci_categories: []
      external_tests: []
    evidence_contribution_types:
