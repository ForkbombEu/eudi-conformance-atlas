  - id: EC-AV-TS
    name: EU Age Verification Solution Technical Specification 1.1.0
    url: https://github.com/eu-digital-identity-wallet/av-doc-technical-specification
    type: ec_technical_specification
    status: published
    status_date: "2026-09-02"
    summary:
      "Commission blueprint specification for the EU age verification solution: an SRS plus architecture description
      with normative high-level requirements for Proof of Age attestations, Age Verification Apps, Attestation Providers, Relying
      Parties and Trusted Lists. Annex A is the Age Verification Profile and Annex B covers Zero-Knowledge Proofs, and a threat
      model is included. Release 1.1.0 makes ZKP-based Proof of Age presentation the preferred mechanism, introduces the AVS
      Unit Attestation based on the EUDI Wallet Unit Attestation, and aligns issuance with the EUDI Wallet issuance framework."
    relevance_for_eudi:
      Direct source for age-over-N issuance and presentation tests in the EUDI-compatible age verification
      profile. That covers the OpenID4VCI/OpenID4VP and DC API profile, Longfellow ZKP (longfellow-libzk-v1) proofs, AVS Unit
      Attestation (TS3-derived) and trusted-list validation. It reuses EUDI Wallet building blocks, so tests can share infrastructure
      with Wallet conformance.
  - id: WE-BUILD-WBCS
    name: WE BUILD Conformance Specifications (WBCS)
    url: https://github.com/webuild-consortium/wp4-architecture/tree/main/conformance-specs
    type: conformance_framework
    status: in_development
    status_date: "2026-10-20"
    summary:
      WE BUILD LSP conformance specifications. They turn architecture decisions into precise implementation requirements
      for issuers, wallets and relying parties, and they configure the WE BUILD Interoperability Test Bed (ITB). The approved
      index lists CS-001 Credential Issuance (file v1.3, 28 Aug 2026), CS-002 Credential Presentation (v1.2, 23 Sep 2026), CS-003
      remote QES with Wallet Units, CS-004/CS-005 WUA/BWUA lifecycle, CS-007 DC API (v0.1 pre-flight draft), CS-010 Revocation
      (v1.1 pre-flight draft), CS-012 SCA attestations / TS12 profile (v1.2, 1 Oct 2026), and CS-015/CS-016 QERDS. CS-006 WRPAC/WRPRC
      issuance, CS-011, CS-013, CS-014 and CS-017 are in review or under investigation.
    relevance_for_eudi:
      The most concrete public pilot conformance profile of OID4VCI/OID4VP/HAIP, WUA lifecycle, revocation
      and TS12 payments in use in 2026. The WE BUILD ITB test suites (83 onboarded participants, public conformance-report overview)
      build on it. It is a good source for pilot-aligned test scenarios, but it is LSP material, not an EU normative document.
