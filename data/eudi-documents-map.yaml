version: '0.2'
name: Credimi EUDI Conformance Documentation Map
description: A consolidated map of legal acts, implementing acts, ARF/WE BUILD documentation, cybersecurity and trust-service
  sources relevant to Credimi's EUDI conformance and interoperability evidence work.
flat_documents:
- id: EUDI-ARF
  name: EUDI Architecture and Reference Framework 3.0.0
  url: https://eudi.dev/3.0.0/
  type: architecture_reference_framework
  summary: The current technical and architectural reference for the EUDI Wallet ecosystem, dated 21 July 2026. Version
    3.0 aligns the framework with the July 2026 amending implementing regulations, introduces relying-party services, strengthens
    Trusted List and List of Trusted Entities handling, and adds functional conformance through FCAF.
  relevance_for_eudi: Primary bridge between legal requirements and implementable Wallet/Issuer/RP behaviour. Credimi evidence
    claims should map to ARF requirements wherever possible.
- id: EUDI-ARF-HLR
  name: EUDI ARF 3.0.0 High-Level Requirements dataset
  url: https://github.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/blob/v3.0.0/hltr/high-level-requirements.csv
  type: architecture_requirements_dataset
  summary: Version-pinned machine-readable CSV containing the normative high-level requirements used by ARF 3.0.0 and rendered
    in Annex 2 by topic and category.
  relevance_for_eudi: Best ARF input for deterministic requirement IDs, taxonomy mapping and traceability from a requirement
    to an evidence claim or FCAF/Credimi test.
- id: EUDI-ARF-DISCUSSION-TOPICS
  name: EUDI ARF 3.0.0 Discussion Topics
  url: https://eudi.dev/3.0.0/discussion-topics/
  type: project_working_documentation
  summary: Versioned index of the ARF discussion papers and refinement rounds, including WUA, relying-party registration,
    wallet-to-wallet interaction, pseudonyms, ZKP, data portability and related open topics.
  relevance_for_eudi: Upstream monitoring source for requirements likely to enter later ARF releases. Discussion papers are
    informative working material and must not be treated as adopted requirements unless integrated into the ARF.
- id: EUDI-ATTESTATION-RULEBOOKS
  name: EUDI Wallet Attestation Rulebooks Catalog
  url: https://github.com/eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog
  type: attestation_rulebook_catalog
  summary: Official catalog of EUDI Wallet attestation rulebooks, currently including PID and mDL rulebooks plus the common
    rulebook template for defining credential structure, semantics, issuance, validation, trust and revocation requirements.
  relevance_for_eudi: Direct source for credential-type-specific issuer, Wallet and verifier tests and for connecting EC TS11
    catalogue entries to concrete attestation rulebooks.
- id: WE-BUILD-WP4
  name: WE BUILD WP4 Trust Group Repository
  url: https://github.com/webuild-consortium/wp4-trust-group
  type: project_working_documentation
  summary: Working documentation for WE BUILD WP4 trust infrastructure, trust registry, participant certificates, LoTL/TL
    integration, wallet conformance and testing scenarios.
  relevance_for_eudi: Highly relevant because it contains concrete pilot-facing trust evaluation use cases that can become
    executable evidence scenarios.
- id: EUDI-FCAF
  name: EUDI Functional Conformance Assessment Framework (FCAF)
  url: https://github.com/eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment
  type: conformance_framework
  summary: European Commission publication repository for the Functional Conformance Assessment Framework, including structured
    functional test specifications, test data, profiles and implementation-conformance material.
  relevance_for_eudi: Primary upstream source for harmonised EUDI functional conformance tests and future Credimi/FCAF integration.
    It is non-normative and does not replace the applicable legal acts or standards.
- id: EU-2014-910
  name: Regulation (EU) No 910/2014 — eIDAS Regulation
  url: https://data.europa.eu/eli/reg/2014/910/oj
  type: regulation
  summary: Original eIDAS Regulation establishing the legal framework for electronic identification and trust services in
    the internal market.
  relevance_for_eudi: Legal foundation on which the EUDI Wallet amendments and implementing acts are built.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32014R0910
- id: EU-2014-910-CONSOLIDATED-2024-10-18
  name: Consolidated eIDAS Regulation after EUDI amendments
  url: https://data.europa.eu/eli/reg/2014/910/2024-10-18
  type: consolidated_regulation
  summary: Consolidated version of Regulation (EU) No 910/2014 incorporating amendments including the European Digital Identity
    Framework changes.
  relevance_for_eudi: Operational legal baseline when interpreting current eIDAS/EUDI obligations across Wallets, issuers,
    relying parties and trust services.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02014R0910-20241018
- id: EU-2024-1183
  name: Regulation (EU) 2024/1183 — European Digital Identity Framework
  url: https://data.europa.eu/eli/reg/2024/1183/oj
  type: regulation
  summary: Amends eIDAS to establish the European Digital Identity Framework and European Digital Identity Wallets.
  relevance_for_eudi: Core legal source for the Wallet ecosystem and the basis for many wallet, issuer, relying party, certification
    and notification implementing acts.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R1183
- id: EU-2021-946
  name: Commission Recommendation (EU) 2021/946 — Common Union Toolbox
  url: https://data.europa.eu/eli/reco/2021/946/oj
  type: recommendation
  summary: Recommendation establishing the coordinated approach and toolbox process that led to the ARF.
  relevance_for_eudi: Historical and procedural basis for ARF development; useful for understanding why ARF is treated as
    a central technical reference.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32021H0946
- id: EU-2024-2847
  name: Regulation (EU) 2024/2847 — Cyber Resilience Act
  url: https://data.europa.eu/eli/reg/2024/2847/oj
  type: regulation
  summary: Establishes cybersecurity requirements for products with digital elements.
  relevance_for_eudi: Relevant to Wallet software and components as cybersecurity products, especially in certification and
    vulnerability-management discussions.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2847
- id: EU-2024-2977
  name: Commission Implementing Regulation (EU) 2024/2977 — PID and electronic attestations of attributes
  url: https://data.europa.eu/eli/reg_impl/2024/2977/oj
  type: implementing_regulation
  summary: Rules for person identification data and electronic attestations of attributes issued to Wallets, including issuance,
    validation information, cryptographic binding and validity status.
  relevance_for_eudi: Central for Issuer/Attestation Provider evidence, PID/EAA issuance tests, revocation/status checks and
    Wallet issuance interoperability.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2977
- id: EU-2024-2979
  name: Commission Implementing Regulation (EU) 2024/2979 — Wallet integrity and core functionalities
  url: https://data.europa.eu/eli/reg_impl/2024/2979/oj
  type: implementing_regulation
  summary: Defines rules around Wallet integrity and core functionalities such as managing PID/EAAs, transaction logs, portability,
    pseudonyms and related user-control features.
  relevance_for_eudi: Relevant for Wallet behavioural evidence beyond issuance/presentation, especially user-facing functionality
    and certification-support evidence.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2979
- id: EU-2024-2980
  name: Commission Implementing Regulation (EU) 2024/2980 — Notifications to the Commission
  url: https://data.europa.eu/eli/reg_impl/2024/2980/oj
  type: implementing_regulation
  summary: Notification-related rules and public machine-readable information flows to the Commission concerning the Wallet
    ecosystem.
  relevance_for_eudi: Relevant for trust infrastructure, machine-readable lists, ecosystem transparency and future lookup
    of notified/certified Wallet information.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2980
- id: EU-2024-2981
  name: Commission Implementing Regulation (EU) 2024/2981 — Wallet certification
  url: https://data.europa.eu/eli/reg_impl/2024/2981/oj
  type: implementing_regulation
  summary: Rules for Wallet certification, including object of certification, national certification schemes, assurance documentation
    and dependency analysis.
  relevance_for_eudi: 'Very important for Credimi''s positioning: Credimi can generate structured assurance evidence that
    may support certification dependency analysis.'
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2981
- id: EU-2024-2982
  name: Commission Implementing Regulation (EU) 2024/2982 — Protocols and interfaces
  url: https://data.europa.eu/eli/reg_impl/2024/2982/oj
  type: implementing_regulation
  summary: Protocols and interfaces for Wallet issuance, presentation, relying-party authentication, selective disclosure,
    erasure requests and reporting relying parties.
  relevance_for_eudi: Central for Credimi's StepCI/Maestro evidence model because it maps directly to remote issuance/presentation
    and user-approval evidence.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2982
- id: EU-2025-846
  name: Commission Implementing Regulation (EU) 2025/846 — Cross-border identity matching
  url: https://data.europa.eu/eli/reg_impl/2025/846/oj
  type: implementing_regulation
  summary: Rules for cross-border identity matching of natural persons when accessing public services.
  relevance_for_eudi: Relevant for public-sector relying-party scenarios and PID identity matching, but not the first priority
    for Wallet automation UX.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R0846
- id: EU-2025-847
  name: Commission Implementing Regulation (EU) 2025/847 — Reactions to Wallet security breaches
  url: https://data.europa.eu/eli/reg_impl/2025/847/oj
  type: implementing_regulation
  summary: Rules for assessment and reaction to security breaches or compromise affecting Wallet solutions.
  relevance_for_eudi: Relevant to operational monitoring and assurance evidence, but mostly outside basic Wallet issuance/presentation
    testing.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R0847
- id: EU-2025-848
  name: Commission Implementing Regulation (EU) 2025/848 — Registration of Wallet-relying parties
  url: https://data.europa.eu/eli/reg_impl/2025/848/oj
  type: implementing_regulation
  summary: Registration of Wallet-relying parties, including national registers, machine-readable interfaces, entitlements,
    access certificates and registration certificates.
  relevance_for_eudi: Crucial for RP/Verifier trust checks, attribute entitlement validation and wallet display of relying-party
    registration information.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R0848
- id: EU-2025-849
  name: Commission Implementing Regulation (EU) 2025/849 — List of certified Wallets
  url: https://data.europa.eu/eli/reg_impl/2025/849/oj
  type: implementing_regulation
  summary: Formats/procedures for Member States to submit information to the Commission and Cooperation Group for the list
    of certified Wallets.
  relevance_for_eudi: Relevant to future checks against certified Wallet lists and certification metadata attached to evidence
    bundles.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R0849
- id: EU-2025-1566
  name: Commission Implementing Regulation (EU) 2025/1566 — Identity and attribute verification standards
  url: https://data.europa.eu/eli/reg_impl/2025/1566/oj
  type: implementing_regulation
  summary: Reference standards for verification of identity and attributes before qualified certificates or qualified electronic
    attestations are issued.
  relevance_for_eudi: Relevant for QTSP/QEAA issuer assurance and identity proofing evidence.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1566
- id: EU-2025-1567
  name: Commission Implementing Regulation (EU) 2025/1567 — Remote QSCD/QSealCD management
  url: https://data.europa.eu/eli/reg_impl/2025/1567/oj
  type: implementing_regulation
  summary: Reference standards for management of remote qualified electronic signature and seal creation devices as qualified
    trust services.
  relevance_for_eudi: Relevant to advanced QTSP/signature/seal scenarios, not core Wallet UI conformance MVP.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1567
- id: EU-2025-1568
  name: Commission Implementing Regulation (EU) 2025/1568 — Peer reviews of eID schemes
  url: https://data.europa.eu/eli/reg_impl/2025/1568/oj
  type: implementing_regulation
  summary: Covers peer review procedures for electronic identification schemes.
  relevance_for_eudi: Relevant to Member State assurance and scheme-level governance; useful for certification/eID scheme
    evidence context.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1568
- id: EU-2025-1569
  name: Commission Implementing Regulation (EU) 2025/1569 — QEAA and public-sector authentic-source EAAs
  url: https://data.europa.eu/eli/reg_impl/2025/1569/oj
  type: implementing_regulation
  summary: Rules for qualified electronic attestations of attributes and EAAs issued by or on behalf of public-sector bodies
    responsible for authentic sources.
  relevance_for_eudi: Important for QEEA/QEAA issuer status, authentic-source attestations, revocation/status evidence and
    issuer entitlement checks.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1569
- id: EU-2025-1570
  name: Commission Implementing Regulation (EU) 2025/1570 — Certified QSCD/QSealCD notification
  url: https://data.europa.eu/eli/reg_impl/2025/1570/oj
  type: implementing_regulation
  summary: Notification information on certified qualified electronic signature and seal creation devices.
  relevance_for_eudi: Relevant to qualified signature/seal ecosystems and advanced trust-service evidence, not first-pass
    Wallet/Issuer/RP automation.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1570
- id: EU-2025-1571
  name: Commission Implementing Regulation (EU) 2025/1571 — Supervisory body annual reports
  url: https://data.europa.eu/eli/reg_impl/2025/1571/oj
  type: implementing_regulation
  summary: Formats/procedures for annual reports by Wallet and trust-service supervisory bodies.
  relevance_for_eudi: Relevant to supervisory reporting and ecosystem transparency; useful context for audit-ready evidence
    but not a runtime test target.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1571
- id: EU-2025-1572
  name: Commission Implementing Regulation (EU) 2025/1572 — Notification of intention for qualified trust services
  url: https://data.europa.eu/eli/reg_impl/2025/1572/oj
  type: implementing_regulation
  summary: Format/procedures for trust service providers notifying intention to start qualified trust services and supervisory
    verification methodology.
  relevance_for_eudi: Relevant to QTSP onboarding and conformity assessment evidence, especially for QEEA/QEAA providers and
    trust-service integrations.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1572
- id: EU-2025-1929
  name: Commission Implementing Regulation (EU) 2025/1929 — Qualified electronic time stamps
  url: https://data.europa.eu/eli/reg_impl/2025/1929/oj
  type: implementing_regulation
  summary: Standards/specifications for qualified electronic time stamps, binding date/time to data and time-source accuracy.
  relevance_for_eudi: Relevant to optional higher-assurance evidence bundles if Credimi later integrates QTSP timestamping.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1929
- id: EU-2025-1942
  name: Commission Implementing Regulation (EU) 2025/1942 — Qualified validation services
  url: https://data.europa.eu/eli/reg_impl/2025/1942/oj
  type: implementing_regulation
  summary: Standards for qualified validation services for qualified electronic signatures and seals.
  relevance_for_eudi: Relevant if Credimi integrates or ingests qualified validation-service results for advanced signature/seal
    evidence.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1942
- id: EU-2025-1943
  name: Commission Implementing Regulation (EU) 2025/1943 — Qualified certificate standards
  url: https://data.europa.eu/eli/reg_impl/2025/1943/oj
  type: implementing_regulation
  summary: Reference standards for qualified certificates for electronic signatures and electronic seals.
  relevance_for_eudi: Relevant to qualified certificate parsing/validation, QTSP trust evidence and advanced verifier/issuer
    certificate checks.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1943
- id: EU-2025-1944
  name: Commission Implementing Regulation (EU) 2025/1944 — QERDS and interoperability
  url: https://data.europa.eu/eli/reg_impl/2025/1944/oj
  type: implementing_regulation
  summary: Standards for qualified electronic registered delivery services and interoperability between such services.
  relevance_for_eudi: Tracked as optional future evidence-delivery context; not relevant to the first Credimi conformance
    MVP.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1944
- id: EU-2025-1945
  name: Commission Implementing Regulation (EU) 2025/1945 — Validation of electronic signatures and seals
  url: https://data.europa.eu/eli/reg_impl/2025/1945/oj
  type: implementing_regulation
  summary: Reference standards for validation of qualified signatures/seals and advanced signatures/seals based on qualified
    certificates.
  relevance_for_eudi: Relevant to verifier-side signature/seal validation and optional qualified validation evidence.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1945
- id: EU-2025-1946
  name: Commission Implementing Regulation (EU) 2025/1946 — Qualified preservation services
  url: https://data.europa.eu/eli/reg_impl/2025/1946/oj
  type: implementing_regulation
  summary: Covers qualified preservation services for qualified electronic signatures and seals.
  relevance_for_eudi: Relevant to long-term preservation of qualified evidence, but not part of first-pass Wallet/Issuer/RP
    conformance automation.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1946
- id: EU-2025-2160
  name: Commission Implementing Regulation (EU) 2025/2160 — Risk management for non-qualified trust services
  url: https://data.europa.eu/eli/reg_impl/2025/2160/oj
  type: implementing_regulation
  summary: Risk management requirements for non-qualified trust services.
  relevance_for_eudi: Relevant to trust-service assurance and operational evidence; not a core Wallet UI test target.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2160
- id: EU-2025-2162
  name: Commission Implementing Regulation (EU) 2025/2162 — Accreditation of CABs and conformity assessment
  url: https://data.europa.eu/eli/reg_impl/2025/2162/oj
  type: implementing_regulation
  summary: Accreditation of conformity assessment bodies assessing QTSPs and qualified trust services, including conformity
    assessment report and scheme.
  relevance_for_eudi: Relevant to CAB-facing evidence and assurance documentation. Helps clarify what kinds of evidence may
    be useful to auditors.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2162
- id: EU-2025-2164
  name: Commission Implementing Decision (EU) 2025/2164 — Trusted List template standard
  url: https://data.europa.eu/eli/dec_impl/2025/2164/oj
  type: implementing_decision
  summary: Identifies the version of the standard for the common Trusted List template.
  relevance_for_eudi: Important for LoTL/TL consumption, Trusted List schema validation and trust infrastructure helper implementation.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025D2164
- id: EU-2025-2527
  name: Commission Implementing Regulation (EU) 2025/2527 — Qualified certificates for website authentication
  url: https://data.europa.eu/eli/reg_impl/2025/2527/oj
  type: implementing_regulation
  summary: Reference standards for qualified certificates for website authentication.
  relevance_for_eudi: Relevant to website authentication certificates and trust-service evidence, possibly useful for issuer/verifier
    endpoint trust in advanced profiles.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2527
- id: EU-2025-2530
  name: Commission Implementing Regulation (EU) 2025/2530 — Requirements for QTSPs
  url: https://data.europa.eu/eli/reg_impl/2025/2530/oj
  type: implementing_regulation
  summary: Requirements for qualified trust service providers providing qualified trust services.
  relevance_for_eudi: Relevant for QEEA/QEAA providers, QTSP assurance and advanced trust-service validation.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2530
- id: EU-2025-2531
  name: Commission Implementing Regulation (EU) 2025/2531 — Qualified electronic ledgers
  url: https://data.europa.eu/eli/reg_impl/2025/2531/oj
  type: implementing_regulation
  summary: Reference standards/specifications for qualified electronic ledgers.
  relevance_for_eudi: Tracked as adjacent trust-service infrastructure; not part of Credimi's first Wallet conformance scope.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2531
- id: EU-2025-2532
  name: Commission Implementing Regulation (EU) 2025/2532 — Qualified electronic archiving services
  url: https://data.europa.eu/eli/reg_impl/2025/2532/oj
  type: implementing_regulation
  summary: Reference standards/specifications for qualified electronic archiving services.
  relevance_for_eudi: Relevant to long-term preservation/archiving of evidence bundles, but not MVP-critical.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R2532
- id: EU-2026-1730
  name: Commission Implementing Regulation (EU) 2026/1730 — Wallet-relying-party registration amendments
  url: https://data.europa.eu/eli/reg_impl/2026/1730/oj
  type: implementing_regulation
  summary: Amends Regulation (EU) 2025/848 with common machine-readable relying-party registers, REST/OpenAPI interfaces,
    intermediary relationships, intended-use information and updated access and registration certificate profiles.
  relevance_for_eudi: Directly relevant to RP registration API testing, certificate validation, intermediary resolution and
    comparing requested attributes with the RP's registered intended use.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32026R1730
- id: EU-2026-1731
  name: Commission Implementing Regulation (EU) 2026/1731 — Wallet technical framework amendments
  url: https://data.europa.eu/eli/reg_impl/2026/1731/oj
  type: implementing_regulation
  summary: Amends Regulations (EU) 2024/2977, 2024/2979, 2024/2980 and 2024/2982, including PID data, Wallet Instance and
    Wallet Unit Attestations, WSCD protection, protocols, cryptographic mechanisms, pseudonyms and the EUDI Wallet Trust Mark.
  relevance_for_eudi: Major source for Wallet, PID Provider and protocol evidence, especially WIA/WUA/key-attestation validation,
    WSCD properties, Trust Mark behaviour and updated issuance and presentation flows.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32026R1731
- id: EU-2026-1735
  name: Commission Implementing Regulation (EU) 2026/1735 — Qualified and public-sector EAA amendments
  url: https://data.europa.eu/eli/reg_impl/2026/1735/oj
  type: implementing_regulation
  summary: Amends Regulation (EU) 2025/1569 with updated EAA provider, issuance, authentic-source verification and privacy-preserving
    revocation requirements.
  relevance_for_eudi: Directly relevant to QEAA and public-sector EAA provider testing, authentic-source interfaces, signed
    or sealed verification results and privacy-preserving status and revocation checks.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32026R1735
- id: EU-2026-248
  name: Commission Implementing Regulation (EU) 2026/248 — Advanced signature and seal formats
  url: https://data.europa.eu/eli/reg_impl/2026/248/oj
  type: implementing_regulation
  summary: Defines the formats of advanced electronic signatures and advanced electronic seals that public-sector bodies must
    recognise and repeals Implementing Decision (EU) 2015/1506.
  relevance_for_eudi: Relevant to Wallet-enabled signature and seal scenarios, public-sector acceptance testing and validation
    against the applicable reference formats and validation methods.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32026R0248
- id: EU-2026-798
  name: Commission Implementing Regulation (EU) 2026/798 — Remote Wallet user onboarding
  url: https://data.europa.eu/eli/reg_impl/2026/798/oj
  type: implementing_regulation
  summary: Defines reference standards and specifications for remotely onboarding Wallet users with an electronic identification
    means at assurance level substantial plus additional procedures that together meet assurance level high.
  relevance_for_eudi: Creates a distinct Wallet onboarding and PID-provider conformance surface covering identity evidence,
    remote proofing controls and the substantial-to-high assurance combination.
  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32026R0798
- id: EU-2015-1502
  name: Commission Implementing Regulation (EU) 2015/1502 — Assurance levels for eID means
  url: https://data.europa.eu/eli/reg_impl/2015/1502/oj
  type: implementing_regulation
  summary: Minimum technical specifications and procedures for low, substantial and high assurance levels for electronic identification
    means.
