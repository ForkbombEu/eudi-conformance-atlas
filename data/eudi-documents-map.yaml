  type: etsi_standard
  layer: etsi
  summary: Qualified certificate statements profile.
  relevance_for_eudi: Defines qualified certificate statements used across EUDI trust infrastructure.
- id: ETSI-EN-319-421
  name: ETSI EN 319 421 V1.3.1 — Timestamping Policy
  url: https://www.etsi.org/deliver/etsi_en/319400_319499/319421/01.03.01_60/en_319421v010301p.pdf
  type: etsi_standard
  layer: etsi
  summary: Policy requirements for Trust Service Providers providing time-stamping services.
  relevance_for_eudi: Relevant for evidence timestamping and qualified time-stamp services.
- id: ETSI-TS-119-441
