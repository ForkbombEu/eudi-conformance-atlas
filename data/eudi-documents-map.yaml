  pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32025R1944
- id: EU-2025-1945
  name: Commission Implementing Regulation (EU) 2025/1945 — Validation of electronic signatures and seals
