flat_documents:
  - id: EUDI-ARF
    name: EUDI Architecture and Reference Framework 3.0.0
    url: https://eudi.dev/3.0.0/
    type: architecture_reference_framework
    status: published
    status_date: "2026-07-21"
    summary:
      The current technical and architectural reference for the EUDI Wallet ecosystem, dated 21 July 2026. Version 3.0
      aligns the framework with the July 2026 amending implementing regulations, introduces relying-party services, strengthens
      Trusted List and List of Trusted Entities handling, and adds functional conformance through FCAF.
    relevance_for_eudi:
      Primary bridge between legal requirements and implementable Wallet/Issuer/RP behaviour. Credimi evidence
      claims should map to ARF requirements wherever possible.
  - id: EUDI-ARF-HLR
    name: EUDI ARF 3.0.0 High-Level Requirements dataset
    url: https://github.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/blob/v3.0.0/hltr/high-level-requirements.csv
    type: architecture_requirements_dataset
    status: published
    status_date: "2026-07-21"
    summary:
      Version-pinned machine-readable CSV containing the normative high-level requirements used by ARF 3.0.0 and rendered
      in Annex 2 by topic and category.
    relevance_for_eudi:
      Best ARF input for deterministic requirement IDs, taxonomy mapping and traceability from a requirement
      to an evidence claim or FCAF/Credimi test.
  - id: EUDI-ARF-DISCUSSION-TOPICS
    name: EUDI ARF Discussion Topics (live index)
    url: https://eudi.dev/latest/discussion-topics/
    type: project_working_documentation
    status: in_development
    status_date: "2026-10-14"
    status_note:
      "No ARF release after 3.0.0, but discussion papers continued: Topic AB Digital Signature v1.1 (16 Sep 2026),
      Topic E refinement round v1.3 (23 Sep 2026) and Topic AA SCA/payments v0.8 (27 Aug 2026)."
    summary:
      Versioned index of the ARF discussion papers and refinement rounds, including WUA, relying-party registration,
      wallet-to-wallet interaction, pseudonyms, ZKP, data portability and related open topics.
    relevance_for_eudi:
      Upstream monitoring source for requirements likely to enter later ARF releases. Discussion papers are
      informative working material and must not be treated as adopted requirements unless integrated into the ARF.
  - id: EUDI-ATTESTATION-RULEBOOKS
    name: EUDI Wallet Attestation Rulebooks Catalog
    url: https://github.com/eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog
    type: attestation_rulebook_catalog
    status: published
    status_date: "2026-07-17"
    status_note:
      PID Rulebook updated to v1.6 (aligned with amended CIR 2024/2977) and v1.7 (PID private key must not sign transactional
      data). Template updated to v1.5. No new EC rulebooks yet.
    summary:
      Official catalog of EUDI Wallet attestation rulebooks. It still holds only the PID Rulebook (ARF Annex 3.01, v1.7
      of 17 July 2026) and the mDL Rulebook (ARF Annex 3.02), plus the common attestation rulebook template (v1.5 of 8 July
      2026, aligned with ETSI TS 119 472-1 `category`).
    relevance_for_eudi:
      Direct source for credential-type-specific issuer, Wallet and verifier tests and for connecting EC TS11
      catalogue entries to concrete attestation rulebooks.
  - id: WE-BUILD-WP4
    name: WE BUILD WP4 Trust Group Repository (release 0.9.1)
    url: https://github.com/webuild-consortium/wp4-trust-group
    type: project_working_documentation
    status: in_development
    status_date: "2026-08-21"
    status_note:
      Release 0.9 (2026-08-19) moves the baseline to ARF 3.0.0 and CIR (EU) 2026/1730, adding Relying Party Services.
      0.9.1 (2026-08-21) clarifies WRPAC/WRPRC identifier bindings for D4.4.
    summary:
      Working documentation for WE BUILD WP4 trust infrastructure, trust registry, participant certificates, LoTL/TL
      integration, wallet conformance and testing scenarios.
    relevance_for_eudi:
      Highly relevant because it contains concrete pilot-facing trust evaluation use cases that can become
      executable evidence scenarios.
  - id: EUDI-FCAF
    name: EUDI Functional Conformance Assessment Framework (FCAF)
    url: https://conformance.eudi.dev/latest/
    type: conformance_framework
    status: draft
    status_date: "2026-10-14"
    status_note:
      All test-case content remains at the rolling draft stage. The release candidate is targeted for Q1 2027, followed
      by v1.0.0 as the first full-scope baseline suitable for certification.
    summary:
      "European Commission Functional Conformance Assessment Framework (FCAF). It publishes harmonised functional test
      cases, Implementation Conformance Statements (ICS) and shared test building blocks for Wallet Solutions, Relying Party
      and Attestation Provider interfaces. Content moves through four maturity stages: submitted, reviewed (beta), release candidate,
      released baseline."
    relevance_for_eudi:
      Primary upstream source for harmonised EUDI functional conformance tests and future Credimi/FCAF integration.
      It is non-normative and does not replace the applicable legal acts or standards.
  - id: EU-2014-910
    name: Regulation (EU) No 910/2014 — eIDAS Regulation
    url: https://data.europa.eu/eli/reg/2014/910/oj
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32014R0910
    type: regulation
    status: in_force
    status_date: "2014-08-28"
    status_note:
      In force; amended by Directive (EU) 2022/2555 and Regulation (EU) 2024/1183, latest consolidated version 2024-10-18.
      Digital Omnibus proposal COM(2025) 837 would amend Arts 19a/24/45a (proposal only).
    summary:
      Original eIDAS Regulation establishing the legal framework for electronic identification and trust services in
      the internal market.
    relevance_for_eudi: Legal foundation on which the EUDI Wallet amendments and implementing acts are built.
  - id: EU-2014-910-CONSOLIDATED-2024-10-18
    name: Consolidated eIDAS Regulation after EUDI amendments
    url: https://data.europa.eu/eli/reg/2014/910/2024-10-18
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02014R0910-20241018
    type: consolidated_regulation
    status: in_force
    status_date: "2024-10-18"
    status_note: The 2024-10-18 consolidated version remains the latest available.
    summary:
      Consolidated version of Regulation (EU) No 910/2014 incorporating amendments including the European Digital Identity
      Framework changes.
    relevance_for_eudi:
      Operational legal baseline when interpreting current eIDAS/EUDI obligations across Wallets, issuers,
      relying parties and trust services.
  - id: EU-2024-1183
    name: Regulation (EU) 2024/1183 — European Digital Identity Framework
    url: https://data.europa.eu/eli/reg/2024/1183/oj
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R1183
    type: regulation
    status: in_force
    status_date: "2024-04-30"
    status_note: Corrigendum R(06) published 2026-04-07, the latest of six corrigenda; no amending act.
    summary: Amends eIDAS to establish the European Digital Identity Framework and European Digital Identity Wallets.
    relevance_for_eudi:
      Core legal source for the Wallet ecosystem and the basis for many wallet, issuer, relying party, certification
      and notification implementing acts.
  - id: EU-2021-946
    name: Commission Recommendation (EU) 2021/946 — Common Union Toolbox
    url: https://data.europa.eu/eli/reco/2021/946/oj
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32021H0946
    type: recommendation
    status: adopted
    status_date: "2021-06-14"
    status_note: Non-binding Recommendation published in the OJ on 2021-06-14; no amending or repealing act recorded.
    summary: Recommendation establishing the coordinated approach and toolbox process that led to the ARF.
    relevance_for_eudi:
      Historical and procedural basis for ARF development; useful for understanding why ARF is treated as
      a central technical reference.
  - id: EU-2024-2847
    name: Regulation (EU) 2024/2847 — Cyber Resilience Act
    url: https://data.europa.eu/eli/reg/2024/2847/oj
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2847
    type: regulation
    status: in_force
    status_date: "2024-11-20"
    status_note:
      Amended by EHDS Regulation (EU) 2025/327; supplemented by Delegated Regulations (EU) 2025/1535 and 2026/881
      and implemented by Implementing Regulation (EU) 2025/2392. Corrigenda up to R(07) 2026-08-06.
    summary: Establishes cybersecurity requirements for products with digital elements.
    relevance_for_eudi:
      Relevant to Wallet software and components as cybersecurity products, especially in certification and
      vulnerability-management discussions.
  - id: EU-2024-2977
    name: Commission Implementing Regulation (EU) 2024/2977 — PID and electronic attestations of attributes
    url: https://data.europa.eu/eli/reg_impl/2024/2977/oj
    pdf_url: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32024R2977
