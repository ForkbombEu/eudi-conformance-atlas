  url: https://data.europa.eu/eli/reg_impl/2025/2527/oj
  type: implementing_regulation
  summary: Reference standards for qualified certificates for website authentication.
  relevance_for_eudi: Relevant to website authentication certificates and trust-service evidence, possibly useful for issuer/verifier
