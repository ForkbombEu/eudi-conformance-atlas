    status_note:
      Amended by Implementing Regulation (EU) 2026/1731, applicable from 2026-08-11; consolidated version 02024R2977-20260811
      available.
    summary:
      Rules for person identification data and electronic attestations of attributes issued to Wallets, including issuance,
      validation information, cryptographic binding and validity status.
    relevance_for_eudi:
      Central for Issuer/Attestation Provider evidence, PID/EAA issuance tests, revocation/status checks and
      Wallet issuance interoperability.
  - id: EU-2024-2979
    name: Commission Implementing Regulation (EU) 2024/2979 — Wallet integrity and core functionalities
    url: https://data.europa.eu/eli/reg_impl/2024/2979/oj
