logical_groups:
- group_slug: wallet-core-and-certification
  title: Wallet core functionality, certification and assurance
  explanation: Covers the legal and technical basis for Wallet functionality, certification and audit/assurance evidence.
    It moves from the EUDI legal basis to ARF, then to wallet functionality and certification evidence.
  steps:
  - step: Establish Wallet legal basis
    sub_steps:
    - Read the amended eIDAS framework and EUDI Regulation.
    - Use the consolidated text to understand current legal obligations.
    documents:
    - EU-2014-910
    - EU-2014-910-CONSOLIDATED-2024-10-18
    - EU-2024-1183
  - step: Map legal obligations to architecture and high-level requirements
    sub_steps:
    - Use ARF as the technical bridge between law and implementable behaviour.
    - Use WE BUILD where trust-registry or pilot interpretation is more concrete.
    documents:
    - EUDI-ARF
    - WE-BUILD-WP4
  - step: Understand Wallet core functions
    sub_steps:
    - Identify testable user-facing features such as transaction history, portability and pseudonyms.
    - Separate black-box behavioural evidence from internal security/certification evidence.
    documents:
    - EU-2024-2979
  - step: Understand certification and assurance evidence
    sub_steps:
    - Map Credimi reports and Temporal evidence to certification support.
    - Treat Credimi evidence as assurance material, not certification itself.
    documents:
    - EU-2024-2981
    - EU-2025-849
    - EU-2024-482
    - EU-2024-3144
    - EU-2024-2847
- group_slug: wallet-issuance-and-presentation
  title: Wallet issuance and presentation flows
  explanation: 'Covers the main Credimi automation story: Wallet receives credential offers, obtains PID/EAA, processes presentation
    requests, displays RP information, waits for user approval and presents attributes.'
  steps:
  - step: Generate or fetch issuance material
    sub_steps:
    - Issuer or StepCI integration creates a credential offer.
    - Issuer metadata and credential configuration are captured as protocol evidence.
    documents:
    - EU-2024-2977
    - EU-2024-2982
    - EUDI-ARF
  - step: Drive real Wallet issuance
    sub_steps:
    - Maestro opens the credential offer or deeplink.
    - Wallet completes the issuance UI flow.
    - Credimi records screenshots, video and workflow IDs.
    documents:
    - EU-2024-2977
    - EU-2024-2979
    - EU-2024-2982
  - step: Generate or fetch presentation request
    sub_steps:
    - Verifier/RP creates an OpenID4VP-style presentation request.
    - StepCI captures the request and expected callback.
    documents:
    - EU-2024-2982
    - EUDI-ARF
  - step: Drive real Wallet presentation
    sub_steps:
    - Wallet opens the request.
    - Wallet displays RP identity and requested attributes.
    - Wallet presents only after user approval.
    - Verifier receives or rejects the response.
    documents:
    - EU-2024-2982
    - EU-2025-848
    - EUDI-ARF
    - WE-BUILD-WP4
- group_slug: issuer-and-attestation-provider
  title: Issuer, PID Provider, EAA Provider and QEAA/QEEA evidence
  explanation: Covers actors that issue PID and attestations to Wallets. It separates ordinary issuance interoperability from
    qualified/public-sector attestation status, issuer entitlements and revocation/status evidence.
  steps:
  - step: Validate issuer metadata and credential offer
    sub_steps:
    - Check that issuer metadata is reachable and consistent with the offer.
    - Capture protocol evidence before the Wallet flow begins.
    documents:
    - EU-2024-2977
    - EU-2024-2982
    - EUDI-ARF
  - step: Validate PID/EAA issuance behaviour
    sub_steps:
    - Use real Wallet automation for end-to-end issuance.
    - Use headless tests or verifier-side validation for credential-level checks.
    documents:
    - EU-2024-2977
    - EU-2025-1569
    - WE-BUILD-WP4
  - step: Check issuer qualification or entitlement
    sub_steps:
    - Resolve issuer in Trusted Lists or relevant registries.
    - Check whether the issuer is entitled to issue the claimed credential or attestation type.
    - For QEEA/QEAA, include QTSP-like approval evidence where applicable.
    documents:
    - EU-2025-1569
    - EU-2025-2530
    - EU-2025-1572
    - EU-2025-2162
    - EU-2025-2164
    - WE-BUILD-WP4
  - step: Check revocation and validity status
    sub_steps:
    - Fetch issuer validity-status or revocation evidence.
    - Use negative credential fixtures to ensure verifiers reject revoked/invalid credentials.
    documents:
    - EU-2024-2977
    - EU-2025-1569
    - EU-2025-1945
- group_slug: relying-party-and-verifier
  title: Relying Party registration, entitlement and verifier behaviour
  explanation: 'Covers RPs and verifiers: whether they are registered, whether their certificates are valid, whether requested
    attributes match entitlements, and whether verifiers validate received credentials correctly.'
  steps:
  - step: Resolve RP registration
    sub_steps:
    - Look up RP registration in human/machine-readable national registers.
    - Capture declared intended use and entitlements.
    documents:
    - EU-2025-848
    - WE-BUILD-WP4
  - step: Validate RP access and registration certificates
    sub_steps:
    - Parse RP access certificate and registration certificate where present.
    - Check validity period, chain, revocation and consistency with register entries.
    documents:
    - EU-2025-848
    - EU-2024-2982
    - EU-2025-1943
    - EU-2025-1945
  - step: Compare requested attributes with entitlements
    sub_steps:
    - Parse presentation request.
    - Compare requested claims against registered RP entitlements.
    - Expect Wallet warning/rejection or report failure for unauthorized requests.
    documents:
    - EU-2025-848
    - EU-2024-2982
    - EUDI-ARF
    - WE-BUILD-WP4
  - step: Validate credential verification behaviour
    sub_steps:
    - Use real Wallet or headless Wallet to present credentials.
    - Check that verifier accepts valid credentials and rejects invalid/revoked/untrusted credentials.
    documents:
    - EU-2024-2977
    - EU-2025-1569
    - EU-2025-1945
    - WE-BUILD-WP4
- group_slug: trusted-lists-and-trust-infrastructure
  title: Trusted Lists, LoTL, trust anchors and actor status
  explanation: 'Covers machine-readable trust infrastructure. It is central to Credimi''s Level 2 evidence: resolving whether
    issuers, RPs, Wallet Providers, authorities and trust-service providers are present, valid, suspended or revoked.'
  steps:
  - step: Fetch and parse LoTL/TL sources
    sub_steps:
    - Fetch List of Trusted Lists and referenced Trusted Lists.
    - Preserve snapshots and hashes as evidence artifacts.
    documents:
    - EU-2024-2980
    - EU-2015-1505
    - EU-2025-2164
    - WE-BUILD-WP4
  - step: Validate schema, signature/seal and freshness
    sub_steps:
    - Validate TL schemas against the applicable template/version.
    - Validate signatures or seals using configured trust anchors.
    - Check freshness/update timestamps where available.
    documents:
    - EU-2015-1505
    - EU-2025-2164
    - EU-2025-1945
    - WE-BUILD-WP4
  - step: Resolve actors and statuses
    sub_steps:
    - Resolve issuer, RP, Wallet Provider, Registrar and CA entries.
    - Normalize status to valid/suspended/revoked/expired/unknown.
    documents:
    - EU-2025-848
    - EU-2025-1569
    - EU-2025-2530
    - WE-BUILD-WP4
- group_slug: assurance-levels-and-eid-schemes
  title: Assurance levels and electronic identification schemes
  explanation: 'Covers the assurance-level model for electronic identification means: low, substantial and high. It is mostly
    certification/scheme evidence, not a normal runtime Wallet automation test.'
  steps:
  - step: Establish assurance level framework
    sub_steps:
    - Use eIDAS Article 8 and 2015/1502 to understand low/substantial/high levels.
    - Map evidence to enrolment, eID means management, authentication and management/organisation controls.
    documents:
    - EU-2014-910
    - EU-2014-910-CONSOLIDATED-2024-10-18
    - EU-2015-1502
  - step: Relate assurance to Wallet/eID scheme certification
    sub_steps:
    - Treat assurance-level documents as scheme/certification evidence.
    - Do not expose these as normal Maestro action mappings unless a specific test scenario exists.
    documents:
    - EU-2024-2981
    - EU-2025-1568
    - EU-2025-2162
- group_slug: third-party-conformance-and-openid-webuild
  title: Third-party conformance tests and WE BUILD scenarios
  explanation: Covers Credimi's ingestion of external conformance results, especially OpenID Foundation and WE BUILD/headless
    tests. The goal is to normalize third-party outputs into the same evidence report as StepCI/Maestro.
  steps:
  - step: Run external conformance test
    sub_steps:
    - Trigger OpenID Foundation or WE BUILD test suite.
    - Preserve raw result unchanged.
    documents:
    - EUDI-ARF
    - WE-BUILD-WP4
    - EU-2024-2982
  - step: Map external assertions to evidence claims
    sub_steps:
    - Map external test IDs/assertions to Credimi evidence-claim slugs.
    - Record limitations so results are not overclaimed.
    documents:
    - EU-2024-2981
    - EUDI-ARF
    - WE-BUILD-WP4
  - step: Attach results to conformance report
    sub_steps:
    - Include external raw output, normalized result and mapping in the evidence bundle.
    - Use external results to complement real Wallet UI automation.
    documents:
    - EU-2024-2981
- group_slug: qualified-trust-services-and-advanced-assurance
  title: Qualified trust services and advanced assurance add-ons
  explanation: 'Covers QTSP-oriented material: qualified timestamps, qualified validation services, qualified certificates,
    remote QSCD/QSealCD management, preservation, archiving, ledgers and QERDS. These are not MVP blockers for Credimi Wallet
    conformance but matter for advanced assurance and QTSP partners.'
  steps:
  - step: Optional qualified timestamping
    sub_steps:
    - Integrate a QTSP timestamping API only if/when higher-assurance evidence is required.
    - Otherwise keep Temporal timestamps and hash manifests as MVP evidence.
    documents:
    - EU-2025-1929
  - step: Optional qualified validation evidence
    sub_steps:
    - Either perform internal technical validation or ingest qualified validation-service results.
    - Attach qualified validation reports only for advanced/enterprise/QTSP scenarios.
    documents:
    - EU-2025-1942
    - EU-2025-1945
  - step: Qualified certificate and QSCD/QSealCD evidence
    sub_steps:
    - Validate qualified certificate profile where relevant.
    - Track remote QSCD/QSealCD management only for signature/seal scenarios.
    documents:
    - EU-2025-1567
    - EU-2025-1570
    - EU-2025-1943
  - step: Preservation, archiving, ledgers and QERDS
    sub_steps:
    - Track as future evidence-lifecycle capabilities.
    - Do not show in normal Wallet/Issuer/RP UX.
    documents:
    - EU-2025-1944
    - EU-2025-1946
    - EU-2025-2531
    - EU-2025-2532
- group_slug: privacy-cybersecurity-accessibility-and-horizontal-context
  title: Privacy, cybersecurity, accessibility and horizontal legal context
  explanation: Contains cross-cutting legal context. These documents are not usually direct StepCI/Maestro test targets, but
    they frame privacy, security, accessibility and supervisory expectations around the EUDI ecosystem.
  steps:
  - step: Privacy and data protection
    sub_steps:
    - Understand GDPR/ePrivacy obligations around PID/EAA processing, RP requests, erasure and reports.
    - Use privacy references when designing reports and user-facing Wallet/RP evidence.
    documents:
    - EU-2016-679
    - EU-2002-58
    - EU-2018-1725
    - EU-2024-2982
  - step: Cybersecurity and operational assurance
    sub_steps:
    - Use NIS2, CRA and Cybersecurity Act context for operational/security evidence.
    - Keep runtime conformance evidence separate from formal cybersecurity certification.
    documents:
    - EU-2022-2555
    - EU-2024-2847
    - EU-2019-881
    - EU-2024-482
    - EU-2024-3144
    - EU-2025-847
  - step: Accessibility
    sub_steps:
    - Track accessibility as a user-facing and public-service requirement context.
    - Consider future UI/accessibility evidence for Wallet/RP flows.
    documents:
    - EU-2016-2102
    - EU-2019-882
