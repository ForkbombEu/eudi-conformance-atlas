    status_note: Amended by Implementing Regulation (EU) 2026/1731; consolidated version 02024R2979-20260811 available.
    summary:
      Defines rules around Wallet integrity and core functionalities such as managing PID/EAAs, transaction logs, portability,
      pseudonyms and related user-control features.
    relevance_for_eudi:
      Relevant for Wallet behavioural evidence beyond issuance/presentation, especially user-facing functionality
      and certification-support evidence.
