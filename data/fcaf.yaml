source:
  name: EUDI Wallet FCAF
  description: Functional Conformance Assessment Framework for the European Digital Identity Wallet
  standard: https://conformance.eudi.dev/
  standard_repository: https://github.com/eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment
  config_repository: https://github.com/ForkbombEu/credimi/tree/main/config_templates/fcaf
  upstream_commit: b2427f0377f86eee9fd7867e79a4672fc74f7df9
  imported: "2026-10-29"
roles:
  - key: attestation_provider
    label: Attestation Provider
    description: "Wallet solution acting as attestation provider: engagement, main interaction, protocol messages and device binding."
  - key: relying_party
    label: Relying Party
    description: "Wallet solution acting as relying party: data model, message structure, interaction, shared rules and security mechanisms."
