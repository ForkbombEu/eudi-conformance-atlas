version: "3"

tasks:
  install:
    cmds:
      - npm ci

  build:
    cmds:
      - npm run build

  test:
    cmds:
      - npm test

  lint:
    cmds:
      - task lint:design

  lint:design:
    cmds:
      - if [ -f DESIGN.md ]; then npx --yes @google/design.md lint DESIGN.md; fi

  serve:
    cmds:
      - npm start
